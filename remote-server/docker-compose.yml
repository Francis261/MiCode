services:
  devforge-remote:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DEVFORGE_WORKSPACES: /workspaces
    volumes:
      - ./workspaces:/workspaces
    expose:
      - "8787"
    # Put behind Caddy/Nginx/Cloudflare Tunnel with HTTPS.
    # Do not publish 8787 directly to the public internet.
